name: Publish APT repository

# Rebuilds the whole repository from scratch on every run and deploys it to GitHub Pages
# (a Pages deployment replaces the whole site, so both distributions are assembled together):
#
#   stable    every .deb attached to a non-prerelease GitHub release (every v* tag), full history
#   unstable  the .deb files of the floating "unstable" pre-release (latest build of main only)
#
# Stateless: nothing is carried over between runs, so the repository always matches the Releases page.
#
# One-time setup (already done): Settings > Pages > Source = "GitHub Actions", and the repo secrets
# APT_GPG_PRIVATE_KEY / APT_GPG_PASSPHRASE holding the signing key (see README, "APT repository").
on:
  workflow_call:

permissions:
  contents: read

# deployments replace the whole site: never run two at once
concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  apt-repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::secret APT_GPG_PRIVATE_KEY is not set"; exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/passphrase" >> "$GITHUB_ENV"

      - name: Download every released .deb (stable)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p debs-stable
          # prereleases (notably "unstable") are excluded: they get their own distribution
          for tag in $(gh release list --limit 1000 --json tagName,isPrerelease \
                         --jq '.[] | select(.isPrerelease == false) | .tagName'); do
            gh release download "$tag" --pattern '*.deb' --dir debs-stable --skip-existing || true
          done
          ls -la debs-stable

      - name: Download the current unstable .deb files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p debs-unstable
          # no unstable release yet the very first time: leave that distribution empty
          gh release download unstable --pattern '*.deb' --dir debs-unstable --skip-existing || true
          ls -la debs-unstable

      - name: Build the signed repository
        run: |
          # GitHub Pages host names are lower-case
          export REPO_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          packaging/apt/build-repo.sh debs-stable debs-unstable site
          rm -f "$GPG_PASSPHRASE_FILE"
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
